name: Build and test English Center

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore EnglishCenter.sln
      - run: dotnet build EnglishCenter.sln --configuration Release --no-restore
      - run: dotnet test EnglishCenter.Tests/EnglishCenter.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"
