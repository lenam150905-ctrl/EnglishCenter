<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Center - Đăng nhập</title>

    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-left">
                <div class="brand">
                    <div class="brand-icon">E</div>
                    <span>English Center</span>
                </div>

                <div class="welcome-content">
                    <p class="small-title">WELCOME BACK</p>

                    <h1>
                        Học tiếng Anh<br>
                        theo cách của bạn
                    </h1>

                    <p class="welcome-description">
                        Đăng nhập để tiếp tục quản lý khóa học,
                        lịch học, kết quả và chứng chỉ của bạn.
                    </p>
                </div>

                <div class="login-decoration">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="login-right">

                <div class="login-header">
                    <h2>Đăng nhập</h2>
                    <p>Vui lòng nhập thông tin tài khoản</p>
                </div>

                <form id="loginForm">

                    <div class="form-group">
          <label for="loginInput">
    Email hoặc tên đăng nhập
</label>

<input
    type="text"
    id="loginInput"
    name="userName"
    placeholder="Nhập email hoặc tên đăng nhập"
    autocomplete="username"
    required
>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="password">Mật khẩu</label>

                            <a href="#" id="forgotPassword">
                                Quên mật khẩu?
                            </a>
                        </div>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Nhập mật khẩu"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="toggle-password"
                                id="togglePassword"
                                aria-label="Hiện hoặc ẩn mật khẩu"
                            >
                                👁
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                    </div>

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >
                        <span id="loginButtonText">Đăng nhập</span>
                        <span
                            id="loginLoading"
                            class="loading-spinner hidden"
                        ></span>
                    </button>

                    <p
                        id="loginMessage"
                        class="login-message"
                    ></p>

                </form>

                <div class="login-footer">
                    <span>Chưa có tài khoản?</span>
                    <a href="#" id="registerLink">Đăng ký ngay</a>
                </div>

            </div>

        </section>

    </main>

    <script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
