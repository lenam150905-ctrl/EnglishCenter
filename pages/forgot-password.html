<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - English Center</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card recovery-card">
            <aside class="login-left">
                <div class="brand"><div class="brand-icon">E</div><span>English Center</span></div>
                <div class="welcome-content">
                    <p class="small-title">ACCOUNT RECOVERY</p>
                    <h1>Lấy lại quyền<br>truy cập của bạn</h1>
                    <p>Chúng tôi sẽ gửi mã xác thực đến email đã liên kết với tài khoản.</p>
                </div>
                <div class="login-decoration"><span></span><span></span><span></span></div>
            </aside>
            <section class="login-right">
                <div class="login-box">
                    <div class="login-header">
                        <h2 id="recoveryTitle">Quên mật khẩu?</h2>
                        <p id="recoveryDescription">Nhập email để nhận mã OTP gồm 6 chữ số.</p>
                    </div>
                    <div class="progress-steps" aria-label="Tiến trình đặt lại mật khẩu">
                        <span class="active">1</span><i></i><span>2</span><i></i><span>3</span>
                    </div>
                    <form id="forgotForm" class="recovery-step active">
                        <div class="form-group">
                            <label for="recoveryEmail">Email tài khoản</label>
                            <input id="recoveryEmail" type="email" autocomplete="email" placeholder="name@example.com" required>
                        </div>
                        <button class="login-button" type="submit">Gửi mã OTP</button>
                    </form>
                    <form id="otpForm" class="recovery-step">
                        <div class="form-group">
                            <label for="recoveryOtp">Mã xác thực</label>
                            <input id="recoveryOtp" class="otp-input" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Nhập 6 chữ số" required>
                        </div>
                        <button class="login-button" type="submit">Xác nhận mã OTP</button>
                    </form>
                    <form id="resetForm" class="recovery-step">
                        <div class="form-group">
                            <label for="newPassword">Mật khẩu mới</label>
                            <input id="newPassword" type="password" autocomplete="new-password" placeholder="Ít nhất 6 ký tự" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                            <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Nhập lại mật khẩu" required>
                        </div>
                        <button class="login-button" type="submit">Đặt lại mật khẩu</button>
                    </form>
                    <p id="recoveryMessage" class="login-message" aria-live="polite"></p>
                    <div class="login-footer"><a href="../index.html">← Quay lại đăng nhập</a></div>
                </div>
            </section>
        </section>
    </main>
    <script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/forgot-password.js"></script>
</body>
</html>
